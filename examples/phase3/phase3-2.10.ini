# LinuxCNC 2.10 spindle acceptance variant of the Phase 3 XYZ machine.
[EMC]
VERSION = 1.1
MACHINE = Virtual Stepper-Ninja Phase 6.1 (LinuxCNC 2.10)
DEBUG = 0

[DISPLAY]
# Existing LinuxCNC interface, not a simulator GUI.
DISPLAY = axis
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = COMMANDED
MAX_FEED_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 20
INCREMENTS = 1mm, 0.1mm, 0.01mm

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = phase3.var
RS274NGC_STARTUP_CODE = G21 G90 G40 G49 G80

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = phase3.tbl

[HAL]
HALFILE = phase3-2.10.hal

[TRAJ]
COORDINATES = X Y Z
SPINDLES = 1
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 20
MAX_LINEAR_ACCELERATION = 100
NO_FORCE_HOMING = 0

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 24000
MAX_REVERSE_VELOCITY = 24000

[AXIS_X]
MIN_LIMIT = 0
MAX_LIMIT = 600
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
[AXIS_Y]
MIN_LIMIT = 0
MAX_LIMIT = 400
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
[AXIS_Z]
MIN_LIMIT = -200
MAX_LIMIT = 0
MAX_VELOCITY = 20
MAX_ACCELERATION = 100

[JOINT_0]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = 0
MAX_LIMIT = 600
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = -1
HOME_SEARCH_VEL = -2
HOME_LATCH_VEL = -0.2
HOME_SEQUENCE = 0
HOME_FINAL_VEL = 5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO

[JOINT_1]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = 0
MAX_LIMIT = 400
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = -1
HOME_SEARCH_VEL = -2
HOME_LATCH_VEL = -0.2
HOME_SEQUENCE = 1
HOME_FINAL_VEL = 5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO

[JOINT_2]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = -200
MAX_LIMIT = 0
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = 1
HOME_SEARCH_VEL = 2
HOME_LATCH_VEL = 0.2
HOME_SEQUENCE = 2
HOME_FINAL_VEL = 5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
