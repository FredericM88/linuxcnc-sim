# Step coordinates for exactly 400 steps/mm. Sensors disabled without this file.
# Min/max share the actual original HAL input for each axis.
limits set X min -400 40 22
limits set X max 240400 40 22
limits set Y min -400 40 26
limits set Y max 160400 40 26
limits set Z min -80400 40 27
limits set Z max 400 40 27
# Enable the probe AFTER homing so probing stays separate from home-switch I/O.
# Console: probe plane Z -2000 28
probe off
