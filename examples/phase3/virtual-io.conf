# Step coordinates for exactly 400 steps/mm. Sensors disabled without this file.
# Min/max share the actual original HAL input for each axis.
limits set X min -4000 40 22
limits set X max 32000 40 22
limits set Y min -4000 40 26
limits set Y max 32000 40 26
limits set Z min -12000 40 27
limits set Z max 4000 40 27
# Enable the probe AFTER homing: the Z home search crosses this surface.
# Console: probe plane Z -2000 28
probe off
