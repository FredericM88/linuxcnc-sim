# Phase 5 accepted milling scene. Material stays OFF during homing.
# Paths are relative to this INI, not the process working directory.
[SIMULATOR]
UNITS = mm
STATS_INTERVAL_MS = 0

[NETWORK]
BIND_ADDRESS = 192.168.50.2
PORT = 8888

[AXIS_X]
TYPE = linear
STEPS_PER_UNIT = 400
[AXIS_Y]
TYPE = linear
STEPS_PER_UNIT = 400
[AXIS_Z]
TYPE = linear
STEPS_PER_UNIT = 400
[AXIS_A]
TYPE = rotary
STEPS_PER_UNIT = 400

[MATERIAL]
ENABLED = false
BATCH_MS = 20
WORKERS = 1
[MESH]
WORKERS = 4
[RENDER]
ENABLED = true

[WORKPIECE]
SIZE = 30,20,10
POSITION = 15,10,-10
ORIGIN = center,center,max
VOXEL_SIZE = 0.10

[TOOL]
TYPE = flat-end
DIAMETER = 6.0
CUTTING_LENGTH = 20.0

[SPINDLE]
MAX_RPM = 24000
ENCODER_COUNTS_PER_REV = 1024

[VIRTUAL_IO]
CONFIG = ../phase3/virtual-io.conf
