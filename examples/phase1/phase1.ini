# Standalone virtual XYZ machine; no existing user configuration is modified.
[EMC]
VERSION = 1.1
MACHINE = Virtual Stepper-Ninja Phase 1
DEBUG = 0

[DISPLAY]
# Existing LinuxCNC interface, not a simulator GUI.
DISPLAY = axis
POSITION_OFFSET = MACHINE
POSITION_FEEDBACK = COMMANDED
MAX_FEED_OVERRIDE = 1.2
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 20
INCREMENTS = 1mm, 0.1mm, 0.01mm

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = phase1.var
RS274NGC_STARTUP_CODE = G21 G90 G40 G49 G80

[EMCMOT]
EMCMOT = motmod
SERVO_PERIOD = 1000000
COMM_TIMEOUT = 1.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = phase1.tbl

[HAL]
HALFILE = phase1.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1
MAX_LINEAR_VELOCITY = 20
MAX_LINEAR_ACCELERATION = 100
NO_FORCE_HOMING = 0

[AXIS_X]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
[AXIS_Y]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
[AXIS_Z]
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100

[JOINT_0]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
[JOINT_1]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 1
[JOINT_2]
TYPE = LINEAR
INPUT_SCALE = 400
MIN_LIMIT = -100
MAX_LIMIT = 100
MAX_VELOCITY = 20
MAX_ACCELERATION = 100
FERROR = 1
MIN_FERROR = 0.1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 2
